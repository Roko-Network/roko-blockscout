# roko-explorer explorer front — HTTP ONLY.
#
# TLS is terminated UPSTREAM, never here:
#   - explorer.roko.internal : npm01 (NPM, internal CA cert)  -> roko-explorer:80
#   - explorer.roko.network  : Cloudflare edge -> cloudflared tunnel on oberth -> roko-explorer:80
# Both forward over the internal network to this port 80. We route by Host to the
# matching per-domain frontend (the Blockscout frontend bakes a single
# NEXT_PUBLIC_*_HOST, so each domain needs its own frontend container). The backend
# is shared (host-agnostic).
#
# Upstream MUST preserve the original Host header and send X-Forwarded-Proto=https.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Trust the scheme reported by the upstream TLS terminator; default https because
# roko-explorer is always fronted by npm01 / Cloudflare and never served plaintext to clients.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      https;
}

# Recover the real client IP from trusted proxies only (cloudflared on the host,
# npm01, and the docker bridge). Without this, nginx and the backend see the
# tunnel/proxy IP for every request, so per-IP rate limiting and access logs
# collapse to a single client. Only our own proxy ranges are trusted, so a
# client-supplied X-Forwarded-For cannot spoof the real IP. (roko/roko-blockscout#2)
set_real_ip_from 127.0.0.1;        # cloudflared (host-local) + loopback
set_real_ip_from 10.0.42.0/24;     # fleet net: npm01 (.103) + apps01 host
set_real_ip_from 172.16.0.0/12;    # docker bridge / compose networks
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ---- QoS / rate limiting (roko/roko-blockscout#3) ----
# Per-IP limit key. On the public path Cloudflare sends CF-Connecting-IP = the
# single real client IP, so we key on it directly — this keeps per-IP limiting
# correct even where realip's $remote_addr rewrite is unreliable under docker
# port-publishing (the runtime caveat noted on #2/#3). On the internal (npm01)
# path there is no CF header, so we fall back to $binary_remote_addr (which
# realip resolves from X-Forwarded-For).
map $http_cf_connecting_ip $limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Emit Retry-After only on 429 (rate-limited) responses; empty otherwise
# (nginx omits an add_header with an empty value).
map $status $qos_retry_after {
    429     "10";
    default "";
}

# Conservative shared-host limits — protect the HDD-backed DB first, loosen with
# data (roctinam/devops#50). 5 req/s sustained per IP on /api with burst 20 so a
# single page's API fan-out is not 429'd; at most 20 concurrent connections/IP.
limit_req_zone  $limit_key zone=api:10m rate=5r/s;
limit_conn_zone $limit_key zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# Slow-loris hardening.
client_header_timeout 10s;
client_body_timeout   10s;

# ---- internal: explorer.roko.internal -> frontend-internal ----
server {
    listen 80;
    server_name roko-explorer.rokonetwork.internal blockexplorer.rokonetwork.internal explorer.roko.internal;
    proxy_http_version 1.1;

    # Cap concurrent connections per client IP (websockets + API + page loads).
    limit_conn perip 20;

    location ^~ /api/v2/faucet/ {
        proxy_pass            https://roko-admin.ntfork.com/api/faucet/;
        proxy_set_header      Host "roko-admin.ntfork.com";
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Content-Type "application/json";
        proxy_ssl_server_name on;
    }

    # ---- CDN cache policy (roko/roko-blockscout#1) ----
    # Read-heavy, non-personalized GET API — safe to cache briefly at the edge.
    # We override the backend's own Cache-Control (proxy_hide_header) so app
    # defaults can neither leak cacheability on dynamic paths nor fight the edge
    # policy. Upstream ETag, when present, is passed through for revalidation.
    # Cloudflare only caches GET/HEAD, so emitting these on other methods is inert.
    # TTLs are conservative placeholders pending roctinam/devops#50; pair with the
    # edge Cache Rules in roctinam/devops#51.
    # rate limit (#3): guards against cache-busting query strings that bypass the
    # edge cache and hit the DB. CF does not cache 429s, so the cache headers on a
    # rate-limited response are inert at the edge.
    location ^~ /api/v2/stats {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=15, s-maxage=30" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    location ^~ /api/v2/main-page/ {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=15, s-maxage=30" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    location ^~ /api/v2/blocks {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=10, s-maxage=15" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    # WebSocket — never rate-limit (limit_req would drop frames) or cache.
    location ^~ /socket {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
    }

    # Everything else on /api, plus auth, is dynamic / live / per-user: never
    # cache, and rate-limit (this is the uncached DB-facing surface). /socket is
    # handled by its own location above and is not rate-limited.
    location ~ ^/(api(?!-docs$)|socket|sitemap.xml|auth/auth0|auth/auth0/callback|auth/logout) {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    # Content-hashed, immutable frontend assets — cache hard at edge + browser.
    location ^~ /_next/static/ {
        proxy_pass            http://frontend-internal:3000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass            http://frontend-internal:3000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
    }
}

# ---- public: explorer.roko.network -> frontend-public (via cloudflared on oberth) ----
server {
    listen 80;
    server_name explorer.roko.network;
    proxy_http_version 1.1;

    # Public path is fronted by Cloudflare: CF-Connecting-IP is the single real
    # client IP and is more reliable than walking X-Forwarded-For behind the
    # tunnel. Trusted-proxy set (set_real_ip_from, http level) still gates it. (#3)
    real_ip_header CF-Connecting-IP;

    # Cap concurrent connections per client IP (websockets + API + page loads).
    limit_conn perip 20;

    # Safe ROKO HTTP/WebSocket JSON-RPC through the already-routed explorer
    # Cloudflare Tunnel. The host listener is Docker-bridge restricted and
    # forwards only to the node's loopback `--rpc-methods Safe` endpoint.
    # Keeping this path on explorer.roko.network avoids making tunnel-config
    # authority a prerequisite for bootstrap; rpc.roko.network can be an alias
    # later without changing the origin security boundary.
    location = /rpc {
        proxy_pass            http://host.docker.internal:9946/;
        proxy_set_header      Host rpc.roko.network;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
    }

    location ^~ /rpc/ {
        proxy_pass            http://host.docker.internal:9946/;
        proxy_set_header      Host rpc.roko.network;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
    }

    location ^~ /api/v2/faucet/ {
        proxy_pass            https://roko-admin.ntfork.com/api/faucet/;
        proxy_set_header      Host "roko-admin.ntfork.com";
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Content-Type "application/json";
        proxy_ssl_server_name on;
    }

    # ---- CDN cache policy (roko/roko-blockscout#1) ----
    # Read-heavy, non-personalized GET API — safe to cache briefly at the edge.
    # We override the backend's own Cache-Control (proxy_hide_header) so app
    # defaults can neither leak cacheability on dynamic paths nor fight the edge
    # policy. Upstream ETag, when present, is passed through for revalidation.
    # Cloudflare only caches GET/HEAD, so emitting these on other methods is inert.
    # TTLs are conservative placeholders pending roctinam/devops#50; pair with the
    # edge Cache Rules in roctinam/devops#51.
    # rate limit (#3): guards against cache-busting query strings that bypass the
    # edge cache and hit the DB. CF does not cache 429s, so the cache headers on a
    # rate-limited response are inert at the edge.
    location ^~ /api/v2/stats {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=15, s-maxage=30" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    location ^~ /api/v2/main-page/ {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=15, s-maxage=30" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    location ^~ /api/v2/blocks {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;
        add_header            Cache-Control "public, max-age=10, s-maxage=15" always;
        add_header            Vary "Accept-Encoding" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    # WebSocket — never rate-limit (limit_req would drop frames) or cache.
    location ^~ /socket {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
    }

    # Everything else on /api, plus auth, is dynamic / live / per-user: never
    # cache, and rate-limit (this is the uncached DB-facing surface). /socket is
    # handled by its own location above and is not rate-limited.
    location ~ ^/(api(?!-docs$)|socket|sitemap.xml|auth/auth0|auth/auth0/callback|auth/logout) {
        proxy_pass            http://backend:4000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "no-store" always;
        add_header            Retry-After $qos_retry_after always;
        limit_req             zone=api burst=20 nodelay;
    }

    # Content-hashed, immutable frontend assets — cache hard at edge + browser.
    location ^~ /_next/static/ {
        proxy_pass            http://frontend-public:3000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_hide_header     Cache-Control;
        add_header            Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass            http://frontend-public:3000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $fwd_proto;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
    }
}

# ---- reject unknown Host (defense in depth) ----
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
