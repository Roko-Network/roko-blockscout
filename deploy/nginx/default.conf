map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Redirect HTTP to HTTPS (except certbot challenges)
server {
    listen 80;
    server_name roko-explorer.ntfork.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name roko-explorer.ntfork.com;
    proxy_http_version 1.1;

    ssl_certificate /etc/letsencrypt/live/roko-explorer.ntfork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roko-explorer.ntfork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Faucet proxy (before general API catch-all)
    location ^~ /api/v2/faucet/ {
        proxy_pass            https://roko-admin.ntfork.com/api/faucet/;
        proxy_http_version    1.1;
        proxy_set_header      Host "roko-admin.ntfork.com";
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Content-Type "application/json";
        proxy_ssl_server_name on;
    }

    location ~ ^/(api(?!-docs$)|socket|sitemap.xml|auth/auth0|auth/auth0/callback|auth/logout) {
        proxy_pass            http://backend:4000;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
    }

    location / {
        proxy_pass            http://frontend:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_cache_bypass    $http_upgrade;
    }
}
