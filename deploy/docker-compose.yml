services:
  redis-db:
    image: redis:alpine
    restart: always
    container_name: redis-db
    volumes:
      - redis-data:/data

  db:
    image: postgres:17
    restart: always
    container_name: db
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    image: roko-blockscout-backend:local
    restart: always
    stop_grace_period: 5m
    container_name: backend
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ./envs/backend.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_VARIANT: 'geth'

  frontend:
    depends_on:
      - backend
    image: roko-blockscout-frontend:local
    restart: always
    container_name: frontend
    env_file:
      - ./envs/frontend.env

  proxy:
    depends_on:
      - backend
      - frontend
    image: nginx
    container_name: proxy
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"
      - "./certbot-webroot:/var/www/certbot:ro"
    ports:
      - "80:80"
      - "443:443"

volumes:
  redis-data:
  postgres-data:
