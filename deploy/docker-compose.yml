services:
  redis-db:
    image: redis:alpine
    restart: always
    container_name: redis-db
    volumes:
      - redis-data:/data

  db:
    image: postgres:17
    restart: always
    container_name: db
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    image: ${ROKO_BACKEND_IMAGE:-git.integrolabs.net/roko/roko-blockscout-backend:testnet}
    restart: always
    stop_grace_period: 5m
    container_name: backend
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ./envs/backend.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_VARIANT: 'geth'

  # Two frontend containers: the Blockscout frontend bakes a single
  # NEXT_PUBLIC_*_HOST at container start, so each domain gets its own container.
  # nginx routes by Host. Same image, different env_file. Backend is shared.
  frontend-internal:
    depends_on:
      - backend
    image: ${ROKO_FRONTEND_IMAGE:-git.integrolabs.net/roko/roko-blockscout-frontend:testnet}
    restart: always
    container_name: frontend-internal
    env_file:
      - ./envs/frontend.internal.env

  frontend-public:
    depends_on:
      - backend
    image: ${ROKO_FRONTEND_IMAGE:-git.integrolabs.net/roko/roko-blockscout-frontend:testnet}
    restart: always
    container_name: frontend-public
    env_file:
      - ./envs/frontend.public.env

  # HTTP-only front. TLS terminates upstream (npm01 (NPM) for explorer.roko.internal,
  # Cloudflare edge for explorer.roko.network via the cloudflared tunnel on oberth).
  # Publishes 80 on apps01's internal interface. TLS terminates upstream.
  proxy:
    depends_on:
      - backend
      - frontend-internal
      - frontend-public
    image: nginx
    container_name: proxy
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - "80:80"

  # Substrate-native indexer sidecar. Subscribes to finalized headers via
  # subxt, decodes pallet events, writes into the `roko.*` schema of the
  # same Postgres instance. Read by SubstrateController in the backend.
  roko-indexer:
    depends_on:
      db:
        condition: service_healthy
    image: ${ROKO_INDEXER_IMAGE:-git.integrolabs.net/roko/roko-indexer:testnet}
    container_name: roko-indexer
    restart: unless-stopped
    # Docker's embedded resolver does not inherit the apps01 host's private
    # search domains. Pin the CMDB-managed boe address while retaining the
    # stable service name used by the relay.
    extra_hosts:
      - "boe.s9.internal:${ROKO_RPC_HOST_IP:-10.0.42.97}"
    environment:
      DATABASE_URL: postgres://roko_indexer:${ROKO_INDEXER_DB_PASSWORD:?ROKO_INDEXER_DB_PASSWORD must be set in deploy/.env}@db:5432/blockscout
      # subxt permits plaintext WebSockets only for loopback URLs. The
      # roko-rpc-tunnel sidecar shares this network namespace and relays that
      # loopback socket to boe's apps01-restricted RPC proxy.
      ROKO_RPC_WS_URL: ${ROKO_RPC_WS_URL:-ws://127.0.0.1:9945}
      ROKO_RPC_FALLBACK_URL: ${ROKO_RPC_FALLBACK_URL:-}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      METRICS_BIND: 0.0.0.0:9100
      RUST_LOG: ${ROKO_INDEXER_RUST_LOG:-info,roko_indexer_sidecar=info}
      LOG_FORMAT: ${ROKO_INDEXER_LOG_FORMAT:-text}
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  roko-rpc-tunnel:
    depends_on:
      - roko-indexer
    image: ${ROKO_RPC_TUNNEL_IMAGE:-alpine/socat:1.8.0.3}
    container_name: roko-rpc-tunnel
    restart: unless-stopped
    network_mode: service:roko-indexer
    command:
      - TCP4-LISTEN:9945,bind=127.0.0.1,reuseaddr,fork
      - TCP4:boe.s9.internal:9945

volumes:
  redis-data:
    name: ${ROKO_REDIS_VOLUME:-roko-blockscout-redis-v52370}
  postgres-data:
    name: ${ROKO_POSTGRES_VOLUME:-roko-blockscout-postgres-v52370}
