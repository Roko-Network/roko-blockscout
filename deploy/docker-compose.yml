services:
  redis-db:
    image: redis:alpine
    restart: always
    container_name: redis-db
    volumes:
      - redis-data:/data

  db:
    image: postgres:17
    restart: always
    container_name: db
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    image: roko-blockscout-backend:local
    restart: always
    stop_grace_period: 5m
    container_name: backend
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ./envs/backend.env
    volumes:
      - ./logs/:/app/logs/
      - ./dets/:/app/dets/
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_VARIANT: 'geth'

  # Two frontend containers: the Blockscout frontend bakes a single
  # NEXT_PUBLIC_*_HOST at container start, so each domain gets its own container.
  # nginx routes by Host. Same image, different env_file. Backend is shared.
  frontend-internal:
    depends_on:
      - backend
    image: roko-blockscout-frontend:local
    restart: always
    container_name: frontend-internal
    env_file:
      - ./envs/frontend.internal.env

  frontend-public:
    depends_on:
      - backend
    image: roko-blockscout-frontend:local
    restart: always
    container_name: frontend-public
    env_file:
      - ./envs/frontend.public.env

  # HTTP-only front. TLS terminates upstream (npm01 (NPM) for explorer.roko.internal,
  # Cloudflare edge for explorer.roko.network via the cloudflared tunnel on oberth).
  # Publishes 80 on roko-explorer's internal interface only (roko-explorer has no public IP).
  proxy:
    depends_on:
      - backend
      - frontend-internal
      - frontend-public
    image: nginx
    container_name: proxy
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - "80:80"

  # Substrate-native indexer sidecar. Subscribes to finalized headers via
  # subxt, decodes pallet events, writes into the `roko.*` schema of the
  # same Postgres instance. Read by SubstrateController in the backend.
  roko-indexer:
    depends_on:
      db:
        condition: service_healthy
    image: ${ROKO_INDEXER_IMAGE:-ghcr.io/roko-network/roko-indexer:testnet-latest-amd64}
    container_name: roko-indexer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://roko_indexer:${ROKO_INDEXER_DB_PASSWORD:?ROKO_INDEXER_DB_PASSWORD must be set in deploy/.env}@db:5432/blockscout
      ROKO_RPC_WS_URL: ${ROKO_RPC_WS_URL:-wss://roko-testnetv2.ntfork.com}
      ROKO_RPC_FALLBACK_URL: ${ROKO_RPC_FALLBACK_URL:-}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      METRICS_BIND: 0.0.0.0:9100
      RUST_LOG: ${ROKO_INDEXER_RUST_LOG:-info,roko_indexer_sidecar=info}
      LOG_FORMAT: ${ROKO_INDEXER_LOG_FORMAT:-text}
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  postgres-data:
