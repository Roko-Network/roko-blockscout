# Cloudflare Zero Trust tunnel config for the PUBLIC explorer domain.
#
# Runs on an INTERNAL host (oberth, or the DMZ edge) — NOT on a public box and
# NOT on roko-explorer. cloudflared dials OUT to the Cloudflare edge, so roko-explorer keeps zero
# inbound ports. It forwards to roko-explorer's HTTP front and preserves the Host header
# so roko-explorer's nginx routes to frontend-public.
#
# Setup (once):
#   cloudflared tunnel login
#   cloudflared tunnel create roko-explorer          # -> creates <UUID>.json creds
#   cloudflared tunnel route dns roko-explorer explorer.roko.network
#   # then run: cloudflared tunnel --config this-file run
#
# The route-dns step creates the CNAME explorer.roko.network -> <UUID>.cfargotunnel.com
# (proxied) in the roko.network Cloudflare zone. TLS is served by the Cloudflare edge.

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_UUID.json

# Optional: keep the connector on the internal net only.
# warp-routing: { enabled: false }

ingress:
  - hostname: explorer.roko.network
    service: http://roko-explorer.s9.internal:80
    originRequest:
      # roko-explorer nginx routes by Host -> send the public hostname so it hits frontend-public
      httpHostHeader: explorer.roko.network
      connectTimeout: 30s
      # roko-explorer is HTTP on the trusted internal net; no origin TLS to verify.
  # Everything else: refuse.
  - service: http_status:404
